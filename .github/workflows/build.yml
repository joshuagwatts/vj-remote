name: build-windows-exe

# Every push to main: build + sanity check, exe kept as a CI artifact.
# Every tag v*: same build, then the exe is attached to a GitHub Release
# so Joshua can download vj-remote.exe and double-click it.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # needed by softprops/action-gh-release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: pyinstaller vj-remote.spec

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vj-remote-windows
          path: dist/vj-remote.exe

      - name: Attach exe to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vj-remote.exe
          generate_release_notes: true
