name: build-windows-exe

# Every push to main: build + sanity check, exe and apk kept as CI artifacts.
# Every tag v*: same builds, then both are attached to a GitHub Release —
# Joshua downloads vj-remote.exe (double-click) and vj-remote.apk (install).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # needed by softprops/action-gh-release on tags

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: pyinstaller vj-remote.spec

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vj-remote-windows
          path: dist/vj-remote.exe

      - name: Attach exe to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vj-remote.exe
          generate_release_notes: true

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk vj-remote.apk

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vj-remote-android
          path: android/vj-remote.apk

      - name: Attach apk to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/vj-remote.apk
