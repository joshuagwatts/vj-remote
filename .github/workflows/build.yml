name: build-windows-exe

# Every push to main: build + sanity check, exe and apk kept as CI artifacts.
# Every tag v*: same builds, then both are attached to a GitHub Release —
# Joshua downloads vj-remote.exe (double-click) and vj-remote.apk (install).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # needed by softprops/action-gh-release on tags

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: pyinstaller vj-remote.spec

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vj-remote-windows
          path: dist/vj-remote.exe

      - name: Attach exe to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vj-remote.exe
          generate_release_notes: true

  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK
        run: |
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          sudo chown -R runner:runner "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install deps
        run: npm ci

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk vj-remote.apk

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vj-remote-android
          path: android/vj-remote.apk

      - name: Attach apk to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/vj-remote.apk
